    <!-- Dis au navigateur de NE PAS mémoriser cette page HTML (seuls les JS/CSS versionnés sont cachés) -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <!-- Tueur de Service Worker + nettoyage de caches résiduels d'anciennes versions.
         Essentiel : si un internaute a visité le site quand il était publié via Emergent/Vercel,
         un service worker a pu rester installé et renvoyer la vieille version. Ce script le tue. -->
    <script>
      (function () {
        try {
          if ("serviceWorker" in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              regs.forEach(function (r) { r.unregister(); });
            }).catch(function () {});
          }
          if (window.caches && caches.keys) {
            caches.keys().then(function (keys) {
              keys.forEach(function (k) { caches.delete(k); });
            }).catch(function () {});
          }
        } catch (e) {}
      })();
    </script>
    <script>
      try {
        localStorage.removeItem("GP_SUN");
        var __root = document.documentElement;
        var __applySun = function () {
          var h = new Date().getHours();
          var day = h >= 9 && h <= 19;
          var light = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
          var contrast = window.matchMedia && window.matchMedia("(prefers-contrast: more)").matches;
          __root.classList.toggle("sun-mode", contrast || (light && day));
        };
        __applySun();
        ["(prefers-color-scheme: light)", "(prefers-contrast: more)"].forEach(function (q) {
          var mq = window.matchMedia(q);
          if (mq.addEventListener) mq.addEventListener("change", __applySun);
        });
        setInterval(__applySun, 60000);
        if ("AmbientLightSensor" in window) {
          try {
            var __sensor = new AmbientLightSensor({ frequency: 0.25 });
            __sensor.addEventListener("reading", function () {
              if (typeof __sensor.illuminance === "number") __root.classList.toggle("sun-mode", __sensor.illuminance > 120);
            });
            __sensor.start();
          } catch (e) {}
        }
      } catch (e) {}
    </script>
